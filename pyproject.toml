[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt"
version = "0.1.0"
description = "Our own pet AI Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.38.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
bolt = "bolt.main:app"